version: '3'
services:
  #--- Web Server ---#
  web:
    build:
      context: ./web-server
      dockerfile: Dockerfile
    container_name: ${WEB_NAME}
    volumes:
      - /home/antares/code:/var/www/html
      - ./web-server/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
      - ./web-server/apache/cert:/etc/apache2/certificate
      - ./web-server/apache/conf:/etc/apache2/sites-enabled
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure
    ports:
      - "80:80"
      - "443:443"
      - "8000:8000"
      - "3000:3000"
    environment:
      - DOCKER_API_VERSION=1.52
      - PHP_IDE_CONFIG:"serverName=docker"
  #--- Mysql ---#
  mysql:
    image: mysql:${MYSQL_VER}
    container_name: ${MYSQL_NAME}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ${MYSQL_DIR}:/var/lib/mysql
    restart: on-failure
    ports:
      - "3306:3306"
  #--- Elasticsearch ---#
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_STACK_VERSION}
    container_name: ${ES_NAME}
    ports:
      - ${ES_PORT}:9200
    volumes:
      - ./elastic/es_data:/usr/share/elasticsearch/data
    environment:
      - cluster.name=${ES_CLUSTER_NAME}
      - node.name=${ES_HOST}
      - discovery.type=single-node
      - ELASTIC_USERNAME=${ES_USER}
      - ELASTIC_PASSWORD=${ES_PASS}
      - xpack.security.enabled=${ES_SECURITY}
  #--- Kibana ---#
  kibana:
    image: docker.elastic.co/kibana/kibana:${ES_STACK_VERSION}
    container_name: ${KIB_NAME}
    volumes:
      - ./elastic/kib_data:/usr/share/kibana/data
    ports:
      - ${KIB_PORT}:5601
    environment:
      - SERVER_NAME=${KIB_HOST}
      - cluster.name=${ES_CLUSTER_NAME}
      - KIBANA_ELASTICSEARCH_ENABLE_TLS=${KIB_ENABLE_TLS}
      - KIBANA_SERVER_ENABLE_TLS=${KIB_ENABLE_TLS}
      - ELASTICSEARCH_HOSTS=${ES_PROTOCOL}://${ES_NAME}:9200
      - ELASTICSEARCH_USERNAME=${ES_USER}
      - ELASTICSEARCH_PASSWORD=${ES_PASS}
